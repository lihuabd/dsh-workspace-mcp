name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不写 version：pnpm/action-setup 会读取 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # lib/ 是提交进仓库的产物，构建后必须与源码一致
      - run: git diff --exit-code -- lib
      # 发布前校验实际打包清单包含 patch/locale/icon/运行时
      - run: pnpm verify:pack
      - run: node --test test/*.test.mjs
