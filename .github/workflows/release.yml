name: Release

# 打 tag（v0.1.0）时：校验版本号 → 发 npm → 生成插件市场索引 → 发布到 GitHub Pages。
# 需要在仓库 Secrets 里配置 NPM_TOKEN，并在 Settings → Pages 选择 “GitHub Actions”。
on:
  push:
    tags: ['v*']
  # 允许在 Actions 页手动重跑，不必反复删/建 tag（例如换过 NPM_TOKEN 之后）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # lib/ 是提交进仓库的产物，构建后必须与源码一致
      - run: git diff --exit-code -- lib
      - run: node --test test/*.test.mjs

      # tag 必须与 package.json 版本一致，避免发出与 tag 不符的包；手动触发时跳过
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const v=require('./package.json').version; if ('v'+v!==process.env.GITHUB_REF_NAME) { console.error('tag '+process.env.GITHUB_REF_NAME+' != v'+v); process.exit(1) }"

      - name: npm auth diagnostics
        run: |
          echo "NPM_TOKEN present: ${{ secrets.NPM_TOKEN != '' }}"
          node -v
          npm -v
          npm config get registry
          npm whoami --registry https://registry.npmjs.org/ || echo "whoami failed (granular tokens often 403 here; publish can still work)"

      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # 已经发过（例如先本地 publish 再打 tag）时跳过，避免 EPUBLISHCONFLICT 中断后续 Pages 部署
          if npm view "${name}@${version}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${name}@${version} already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build market index
        run: pnpm market:index --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
